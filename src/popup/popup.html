<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reselling Tracker Sync</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #111; color: #e5e5e5; margin: 0; padding: 16px; width: 300px; }
    h1 { font-size: 1rem; font-weight: 700; margin: 0 0 4px; }
    p.sub { color: #6b7280; font-size: 0.75rem; margin: 0 0 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1f1f1f; }
    .row:last-child { border-bottom: none; }
    .platform { font-size: 0.875rem; font-weight: 500; }
    .meta { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }
    .status { font-size: 0.75rem; text-align: right; }
    .ok { color: #4ade80; }
    .fail { color: #f87171; }
    .syncing { color: #60a5fa; }
    .idle { color: #6b7280; }
    a.settings { display: block; margin-top: 14px; font-size: 0.75rem; color: #3b82f6; text-decoration: none; text-align: center; }
    a.settings:hover { text-decoration: underline; }
    #notConfigured { font-size: 0.8125rem; color: #f87171; margin-bottom: 12px; }
    button.sync-btn { font-size: 0.75rem; background: #1f2937; color: #9ca3af; border: 1px solid #374151; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
    button.sync-btn:hover:not(:disabled) { background: #374151; color: #e5e5e5; }
    button.sync-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <h1 style="margin:0;">Reselling Tracker Sync</h1>
    <button id="popOutBtn" title="Pop out" style="background:none;border:none;color:#4b5563;cursor:pointer;font-size:0.85rem;padding:0 2px;line-height:1;">↗</button>
  </div>
  <p class="sub">Auto-syncs when you visit Amazon or Walmart orders.</p>
  <div id="notConfigured" style="display:none">⚠ Tracker URL or user not set — open Settings.</div>
  <div id="rows">
    <div class="row">
      <div>
        <div class="platform">Amazon</div>
        <div class="meta" id="amazonMeta">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status idle" id="amazonStatus">idle</div>
        <button class="sync-btn" id="syncAmazon">Sync</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="platform">Walmart</div>
        <div class="meta" id="walmartMeta">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status idle" id="walmartStatus">idle</div>
        <button class="sync-btn" id="syncWalmart">Sync</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="platform">Costco</div>
        <div class="meta" id="costcoMeta">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status idle" id="costcoStatus">idle</div>
        <button class="sync-btn" id="syncCostco">Sync</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="platform">BigSky Buyers</div>
        <div class="meta" id="bigskyMeta">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status idle" id="bigskyStatus">idle</div>
        <button class="sync-btn" id="syncBigsky">Sync</button>
      </div>
    </div>
  </div>
  <div id="versionRow" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:0.7rem;color:#4b5563;">
    <span id="versionLabel"></span>
    <a id="versionUpdate" href="https://github.com/frindle/resell-tracker-extension/releases/latest" target="_blank" style="display:none;color:#fbbf24;font-weight:500;text-decoration:underline;cursor:pointer;">update available</a>
  </div>
  <a class="settings" id="openSettings" href="#">⚙ Settings</a>

  <div id="devSection" style="margin-top:14px;border-top:1px solid #1f2937;padding-top:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <span style="font-size:0.75rem;font-weight:600;color:#6b7280;letter-spacing:0.05em;">DEV MODE</span>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="devToggle" style="accent-color:#3b82f6;width:14px;height:14px;" />
        <span id="devToggleLabel" style="font-size:0.75rem;color:#6b7280;">off</span>
      </label>
    </div>
    <div id="devControls" style="display:none;">
      <div style="display:flex;gap:4px;margin-bottom:6px;">
        <input id="devUrl" type="text" placeholder="hostname (e.g. cardcenter.cc)"
          style="flex:1;background:#1f2937;border:1px solid #374151;border-radius:4px;color:#e5e5e5;font-size:0.7rem;padding:3px 6px;outline:none;" />
        <button id="devSpyNow" style="font-size:0.7rem;background:#1d4ed8;color:#fff;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap;">Spy Now</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span id="devLogCount" style="font-size:0.7rem;color:#4b5563;">0 requests</span>
        <div style="display:flex;gap:4px;">
          <button id="devCopyJson" style="font-size:0.7rem;background:#1f2937;color:#9ca3af;border:1px solid #374151;border-radius:4px;padding:2px 6px;cursor:pointer;">Copy JSON</button>
          <button id="devClear" style="font-size:0.7rem;background:#1f2937;color:#9ca3af;border:1px solid #374151;border-radius:4px;padding:2px 6px;cursor:pointer;">Clear</button>
        </div>
      </div>
      <div id="devLog" style="max-height:200px;overflow-y:auto;background:#0d1117;border:1px solid #1f2937;border-radius:4px;font-family:monospace;font-size:0.65rem;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
